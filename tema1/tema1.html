<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="tema1.css">
</head>
<body>
    <div class="header">
        <div class="header_element">
            <img src=".\resurse\casa.png" alt="Casa">
            <a href="#">Home</a>
        </div>
        <div class="header_element">
            <img src=".\resurse\agenda.png" alt="Contact">
            <a href="#">Contact</a>
        </div>
        <div class="header_element">
            <img src=".\resurse\despre.png" alt="Despre">
            <a href="#">Despre</a>
        </div>
    </div>
    <div class="title">
        <h1>Prima ta locuinta cu o broscuta</h1>
    </div>
    <div class="form">
        <div class="form_inputs">
            <div>
                <img src=".\resurse\broasca alea alea.png" alt="broscuta form">
                <input type="text" id="nume" name="nume" placeholder="Numele tau aici...">
            </div>
            <div>
                <img src=".\resurse\broasca alea alea.png" alt="broscuta form">
                <input type="text" id="prenume" name="prenume" placeholder="Prenumele tau aici...">
            </div>
            <div>
                <img src=".\resurse\broasca alea alea.png" alt="broscuta form">
                <input type="text" id="camere" name="email" placeholder="Cate camere vrei...">
            </div>
            <div>
                <img src=".\resurse\broasca alea alea.png" alt="broscuta form">
                <input type="text" id="judet" name="username" placeholder="Judetul dorit...">
            </div>
            <div>
                <img src=".\resurse\broasca alea alea.png" alt="broscuta form">
                <input type="text" id="oras" name="password" placeholder="Orasul dorit...">
            </div>
            <div>
                <img src=".\resurse\broasca alea alea.png" alt="broscuta form">
                <input type="text" id="sector" name="email" placeholder="Sectorul aici...">
            </div>
            <div>
                <img src=".\resurse\broasca alea alea.png" alt="broscuta form">
                <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}" placeholder="Nr de telefon...">
            </div>
            <div>
                <img src=".\resurse\broasca alea alea.png" alt="broscuta form">
                <input type="text" id="detalii" name="detalii" placeholder="Alte detalii...">
            </div>
        </div>
        <div class="form_submit">
            <button type="submit">Submit</button>
        </div>
    </div>  
    <hr style="color: black;">  
    <div class="poze">
        <div class="poze_poza1">
            <img src=".\resurse\poza1.png" alt="Poza1">
        </div>
        <div class="poze_poza2">
            <img src=".\resurse\poza2.png" alt="Poza2">
        </div>
        <div class="poze_poza3">
            <img src=".\resurse\poza3.png" alt="Poza3">
        </div>
    </div>
    <hr stlye="color: black;">
    <div class="footer">
        <h1>Tipuri de locuinte:</h1>
        <ul> 
            <li>Pe lac</li>
            <li>In mlastina</li>
            <li>In rau de munte</li>
            <li>La muzeu</li>
            <li>Intr-o balta de pescuit</li>
        </ul>
    </div>
    <div class="detalii">
        <div class="detalii_broascaTopRight">
            <img src=".\resurse\broasca alea alea.png" alt="Broasca">
        </div>
        <div class="detalii_cerculete_1"></div>
        <div class="detalii_cerculete_2"></div>
        <div class="detalii_cerculete_3"></div>
    </div>
</body>
</html>
