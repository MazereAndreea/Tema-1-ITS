<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="tema1.css">
</head>
<body>
    <div class="header">
        <div class="header_element">
            <img src=".\resurse\casa.png" alt="Casa">
            <a href="#">Home</a>
        </div>
        <div class="header_element">
            <img src=".\resurse\agenda.png" alt="Contact">
            <a href="#">Contact</a>
        </div>
        <div class="header_element">
            <img src=".\resurse\despre.png" alt="Despre">
            <a href="#">Despre</a>
        </div>
    </div>
    <div class="title">
        <h1>Prima ta locuinta cu o broscuta</h1>
    </div>
    <div class="form">
        <form action="/submit" method="post">
            <input type="text" id="nume" name="nume" placeholder="Enter your username">
            <input type="text" id="prenume" name="prenume" placeholder="Enter your password">
            <input type="text" id="camere" name="email" placeholder="Enter your email">
            <input type="text" id="judet" name="username" placeholder="Enter your username">
            <input type="text" id="oras" name="password" placeholder="Enter your password">
            <input type="text" id="sector" name="email" placeholder="Enter your email">
            <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}" placeholder="Enter your username">
            <input type="text" id="detalii" name="detalii" placeholder="Alte detalii...">
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
